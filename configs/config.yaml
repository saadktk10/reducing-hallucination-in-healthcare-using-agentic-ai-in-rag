project: hallucination-verifier-c
seed: 42
plan: 2                          # set after Week 1 pilot: 1 or 2 (Gate G1 resolved to Plan 2)

paths:
  data: data
  cache: data/cache
  results: results
  prompts: prompts

datasets:
  medhallu:
    hf_id: UTAustin-AIHealth/MedHallu
    config: pqa_labeled
    revision: 515060458a945c633debc6fd5baac7764416b724 # pinned HF commit hash (Rule R4.4)
    columns:                     # confirm in Phase 1, update if different
      question: Question
      context: Knowledge
      ground_truth: Ground Truth
      hallucinated: Hallucinated Answer
      difficulty: Difficulty Level
      category: Category of Hallucination
  pubmedqa:
    hf_id: qiaojin/PubMedQA
    config: pqa_labeled
    revision: 9001f2853fb87cab8d220904e0de81ac6973b318 # pinned HF commit hash (Rule R4.4)

pilot:
  spotcheck_n: 50
  fields_n: 20
  rouge_dev_questions: 50           # same as exp1.dev_questions

exp1:
  n_questions: 250
  dev_questions: 50
  test_questions: 200
  stratify_by: difficulty

exp2:
  n_normal: 100
  n_degraded: 100
  extra_degraded_max: 20         # used only if < 25% Hallucinated
  exclude_exp1_dev: true
  chunk_tokens: 250
  chunk_overlap: 30
  top_k: 3
  degraded_search_k: 20          # search wider, drop own doc, keep top_k

models:
  embedder: BAAI/bge-small-en-v1.5
  nli_main: cross-encoder/nli-deberta-v3-small
  nli_optional: cross-encoder/nli-deberta-v3-base
  generator:
    provider: groq
    model_id: qwen/qwen3.8-27b
    temperature: 0
    max_tokens: 256
  judge:
    provider: gemini
    model_id: gemini-3.6-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    temperature: 0
    max_tokens: 1000
    rpm_limit: 10

filter_b:
  num_threads: 6
  batch_size: 16
  max_length: 512
  sentence_splitter: pysbd

baseline:
  rouge_variant: rougeL
  rouge_field: precision         # confirm on dev; see Design.md section 6.3

timing:
  warmup_pairs: 10
  repeats: 2
  percentiles: [50, 95]

stats:
  bootstrap_resamples: 1000
  ci: 0.95
  bootstrap_unit: question       # resample questions, keep pairs together
