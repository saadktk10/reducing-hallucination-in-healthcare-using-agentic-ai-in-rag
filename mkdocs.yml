site_name: MedVerify-C
site_description: "Local NLI Cross-Encoder vs API-Based LLM-as-a-Judge for Hallucination Verification in Healthcare Agentic RAG"
site_url: ""  # Set after repo is published
repo_url: ""  # Set after repo is published
repo_name: ""

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

hooks:
  - hooks/build_stamp.py
  - hooks/tiles.py
  - hooks/progress.py
  - hooks/external_numbers.py

not_in_nav: |
  claim.md

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Manuscript:
      - Overview: manuscript/index.md
      - Abstract: manuscript/00-abstract.md
      - Introduction: manuscript/01-introduction.md
      - Related Work: manuscript/02-related-work.md
      - Methodology: manuscript/03-methodology.md
      - Results: manuscript/04-results.md
      - Discussion: manuscript/05-discussion.md
      - Conclusion: manuscript/06-conclusion.md
  - Write-up:
      - Overview: writeup/index.md
      - Abstract: writeup/00-abstract.md
      - Introduction: writeup/01-introduction.md
      - Related Work: writeup/02-related-work.md
      - Methodology: writeup/03-methodology.md
      - Results: writeup/04-results.md
      - Discussion: writeup/05-discussion.md
      - Conclusion: writeup/06-conclusion.md
  - Progress: progress.md
  - Reference:
      - Design: design.md
      - Rules: rules.md

extra_css:
  - assets/extra.css
